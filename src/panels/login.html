<div class="container">
    <div class="login-home login-tabs card">
        <div class="login-text dynamic-login-title">Vincula tu cuenta de Microsoft</div>

        <div class="login-options">
            <button class="connect connect-home">Vincular</button>
            <button class="cancel cancel-home" style="display: none;">Cancelar</button>
        </div>
    </div>

    <div class="login-offline login-tabs card" style="flex-direction: column;">
        <div class="login-text dynamic-login-title"></div>

        <div style="display: flex; flex-direction: row; gap: 2rem; width: 100%;">
            <div class="login-container">
                <div class="login-header">
                    <span data-translate="login.login">Iniciar sesión</span><span> | </span><span data-translate="login.premium">Premium</span>
                </div>
                <button class="connect connect-microsoftcracked" data-translate="login.microsoft_login">Iniciar sesión con Microsoft</button>
            </div>
            
            <div class="login-container">
                <div class="login-header">
                    <span data-translate="login.login">Iniciar sesión</span><span> | </span><span data-translate="login.offline_mode">No Premium</span>
                </div>
                <div class="input-login">
                    <input type="text" class="email email-offline" placeholder="User" />
                </div>
                <div class="login-options">
                    <button class="connect connect-offline" data-translate="buttons.login">Iniciar sesión</button>
                </div>
                <div class="login-options">
                    <button class="cancel cancel-offline" style="display: none; width: 100%; margin-top: 5px;" data-translate="buttons.cancel">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="login-AZauth login-tabs card">
        <div class="login-text dynamic-login-title">Por favor, inicia sesión para jugar.</div>

        <div class="input-login">
            <input type="text" class="email email-AZauth" placeholder="Correo electrónico" />
            <input type="password" class="password password-AZauth" placeholder="Contraseña" />
        </div>

        <div class="login-options">
            <button class="connect connect-AZauth">Iniciar Sesión</button>
            <button class="cancel cancel-AZauth" style="display: none;">Cancelar</button>
        </div>
    </div>

    <div class="login-AZauth-A2F login-tabs card">
        <div class="login-text">Por favor, ingresa el código de seguridad (2FA).</div>

        <div class="input-login">
            <input type="text" class="A2F A2F-AZauth" placeholder="Código" />
        </div>

        <div class="login-options">
            <button class="connect connect-AZauth-A2F">Validar</button>
            <button class="cancel cancel-AZauth-A2F">Cancelar</button>
        </div>
    </div>
</div>
